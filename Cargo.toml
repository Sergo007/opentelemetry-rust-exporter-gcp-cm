[workspace]
members = ["examples/*"]

[package]
name         = "opentelemetry_gcloud_monitoring_exporter"
version      = "0.23.0"
description  = "Provides support for exporting metrics to Google Cloud Monitoring."
readme       = "README.md"
keywords     = ["exporter", "google-cloud", "metrics", "monitoring", "opentelemetry"]
repository   = "https://github.com/Sergo007/opentelemetry-rust-exporter-gcp-cm"
authors      = ["Yatsina Serhii <yatsyna.sergey@gmail.com>"]
license      = "Apache-2.0"
edition      = "2024"
rust-version = "1.87.0"
exclude      = ["*.sh"]

[lib]
doctest = false

[features]
default                = ["rustls-tls-aws-lc", "tokio"]
tokio                  = ["dep:tokio", "opentelemetry_sdk/rt-tokio"]
native-tls             = ["opentelemetry_resourcedetector_gcp_rust/native-tls", "reqwest/native-tls"]
rustls-tls-aws-lc      = ["opentelemetry_resourcedetector_gcp_rust/rustls-tls-aws-lc", "reqwest/rustls"]
rustls-tls-no-provider = ["opentelemetry_resourcedetector_gcp_rust/rustls-tls-no-provider", "reqwest/rustls-no-provider"]

[dependencies]
opentelemetry                           = { version = "0.31", features = ["metrics"] }
opentelemetry_sdk                       = { version = "0.31", features = ["experimental_metrics_periodicreader_with_async_runtime", "metrics", "spec_unstable_metrics_views"] }
opentelemetry_resourcedetector_gcp_rust = { version = "0.21", default-features = false }

reqwest = { version = "0.13.3", default-features = false, features = ["charset", "http2", "system-proxy"] }

# json serializer/deserializer
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tokio = { version = "1", features = ["fs", "io-util", "sync", "time"], optional = true }

unicode-segmentation = "1.13.2"
rand                 = "0.10.1"
itertools            = "0.14.0"
tracing              = { version = "0.1.44" }

# gcp monitoring sdk
google-cloud-gax           = "1.10.0"
google-cloud-wkt           = "1.4.0"
google-cloud-api           = "1.6.0"
google-cloud-monitoring-v3 = "1.9.0"
thiserror                  = "2.0.18"

[dev-dependencies]
once_cell         = "1.21.1"
pretty_assertions = "1.4.1"
# todo contribute to the project to add the sorted feature
pretty_assertions_sorted_fork = { version = "0.11.0" }
tokio                         = { version = "1.52", features = ["full"] }
